<!DOCTYPE html>
<html>
  <head>
    <title>Business Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <!-- Profile Image -->
      <img
        src="images/profile.jpg"
        alt="Basel's profile photo"
        class="profile-img"
      />

      <!-- Name & Title -->
      <h1>Basel Shibob</h1>
      <p class="job-title">Fullstack Developer Student</p>

      <!-- Divider line -->
      <hr />

      <!-- Contact Info -->
      <div class="contact-info">
        <p>📧 basel@example.com</p>
        <p>🌐 github.com/Basel-shibob</p>
        <p>📍 Location, Country</p>
      </div>

      <!-- Action Buttons -->
      <div class="buttons">
        <a href="mailto:basel@example.com" class="btn">Email</a>
        <a href="https://github.com/Basel-shibob" class="btn btn-outline">GitHub</a>
      </div>
    </div>
  </body>
</html>
